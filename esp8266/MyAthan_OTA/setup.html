<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1'><title>MyAthan Setup</title><style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#f0f2f5;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.card{background:#fff;padding:2rem;border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.1);width:100%;max-width:320px}
h1{color:#1a1a1a;margin-top:0;font-size:24px;text-align:center}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:4px;box-sizing:border-box;font-size:16px}
input[type=submit]{background:#4CAF50;color:#fff;padding:14px 20px;border:none;font-weight:bold}
.label{font-weight:bold;color:#555;display:block;margin-top:10px}
</style></head><body><div class='card'><h1>Enter your WiFi credentials</h1>
<form method='POST' action='/save'>
<label class='label'>WiFi Name (SSID)</label><input type='text' name='ssid' placeholder='Enter SSID'>
<label class='label'>Password</label><input type='text' name='pass' placeholder='Enter Password'>
<input type='submit' value='Connect'></form></div></body></html>
