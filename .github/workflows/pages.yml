name: Deploy web flasher

# HTML for this page lives here. Firmware.bin always comes from esp8266-latest
# (published when someone pushes esp8266-ota). Do not compile on this branch.

on:
  push:
    branches: [esp8266-web-flasher]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: site

      - name: Fetch firmware from esp8266-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download esp8266-latest \
            --repo "${{ github.repository }}" \
            --pattern firmware.bin \
            --pattern version.txt \
            --dir site \
            --clobber
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path("site/version.txt").read_text(encoding="utf-8").strip()
          p = Path("site/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["version"] = version
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          print("USB firmware", version, Path("site/firmware.bin").stat().st_size, "bytes")
          PY

      - name: Stage Pages tree
        run: |
          rm -rf site/.github site/.git
          rm -f site/INSTRUCTIONS.md site/README.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
