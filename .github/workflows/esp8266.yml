name: ESP8266 Firmware (OTA)

# One firmware push: this branch. Publishes esp8266-latest and refreshes the USB page.

on:
  push:
    branches: [esp8266-ota]
    paths:
      - 'esp8266/**'
      - '.github/workflows/esp8266.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP8266 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266@3.1.2

      - name: Pack gzip web pages
        run: |
          cp esp8266/MyAthan_OTA/control_full.html esp8266/MyAthan_OTA/control.html
          python3 esp8266/MyAthan_OTA/pack_web.py

      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp8266:esp8266:nodemcuv2:eesz=4M2M,ssl=all \
            --libraries esp8266/libraries \
            --output-dir build \
            esp8266/MyAthan_OTA

      - name: Prepare release assets
        id: prep
        run: |
          VERSION=$(grep -oP '#define\s+FW_VERSION\s+"\K[^"]+' esp8266/MyAthan_OTA/MyAthan_OTA.ino)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp build/MyAthan_OTA.ino.bin firmware.bin
          printf '%s' "$VERSION" > version.txt
          echo "ESP8266 firmware v$VERSION ($(stat -c%s firmware.bin) bytes)" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish esp8266-latest pre-release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: esp8266-latest
          name: ESP8266 firmware (latest)
          prerelease: true
          files: |
            firmware.bin
            version.txt
          body: |
            Auto-built **ESP8266** MyAthan firmware **v${{ steps.prep.outputs.version }}**.

            USB installer: https://mecharonix.github.io/myathan-firmware/

      - name: Checkout USB flasher page
        uses: actions/checkout@v4
        with:
          ref: esp8266-web-flasher
          path: site

      - name: Stage Pages site from this firmware
        run: |
          cp firmware.bin site/firmware.bin
          cp version.txt site/version.txt
          python3 - <<PY
          import json
          from pathlib import Path
          version = Path("version.txt").read_text(encoding="utf-8").strip()
          p = Path("site/manifest.json")
          m = json.loads(p.read_text(encoding="utf-8"))
          m["version"] = version
          p.write_text(json.dumps(m, indent=2) + "\n", encoding="utf-8")
          print("Pages firmware", version, Path("site/firmware.bin").stat().st_size, "bytes")
          PY
          rm -rf site/.github site/.git
          rm -f site/INSTRUCTIONS.md site/README.md

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
